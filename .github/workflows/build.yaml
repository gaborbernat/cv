name: Build LaTeX document
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "55 10 * * *"
permissions: {}
jobs:
  pdf:
    uses: tox-dev/github-workflows/.github/workflows/latex-to-pages.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: write
      pages: read
    with:
      root-file: main.tex
  build:
    name: build
    needs: pdf
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: 🚦 Require needed jobs 🚦
        uses: tox-dev/github-workflows/required-checks@6.8.0
        with:
          needs: ${{ toJSON(needs) }}
